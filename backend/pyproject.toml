[project]
name = "task-manager-api"
version = "1.0.0"
description = "Task Manager API - FastAPI + SQLAlchemy + PostgreSQL"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "T20", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = true
disallow_untyped_decorators = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
# Put the project root on sys.path so `from app import ...` resolves.
#
# The `pytest` console script does NOT add the working directory to sys.path —
# only `python -m pytest` does. tests/ has no __init__.py, so pytest's prepend
# import mode inserts tests/ rather than this directory, and the package is not
# pip-installed either. Without this line a bare `pytest` fails at conftest
# import while `python -m pytest` succeeds, which is a confusing difference to
# debug. The Dockerfile sets PYTHONPATH=/app to the same end.
pythonpath = ["."]
