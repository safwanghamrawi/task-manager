################################################################################
# HTTPS overlay - opt in once the instance has a DNS name.
#
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
#
# Requires in .env:
#   APP_DOMAIN=tasks.example.com
#   ACME_EMAIL=ops@example.com
#   FRONTEND_ROUTE_RULE=Host(`tasks.example.com`)
#   BACKEND_ROUTE_RULE=Host(`tasks.example.com`) && PathPrefix(`/api`)
# and TCP/443 open in the security group.
################################################################################

services:
  traefik:
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required for TLS}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.tls.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - letsencrypt:/letsencrypt

  backend:
    labels:
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.backend-admin.entrypoints=websecure"
      - "traefik.http.routers.backend-admin.tls=true"
      - "traefik.http.routers.backend-admin.tls.certresolver=letsencrypt"

  frontend:
    labels:
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"

volumes:
  letsencrypt:
